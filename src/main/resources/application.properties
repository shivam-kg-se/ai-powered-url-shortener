spring.application.name=URL-SHORTNER-SB
server.port=8080


spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}
;  spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.database-platform=${DATABASE_DIALECT}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true



jwt.secret=${JWT_SECRET}
jwt.expiration=18000000

logging.level.org.springframework.security=DEBUG
logging.level.com.uss=DEBUG

#mail realted properties

app.otp.mail-from=${OTP_MAIL_FROM}
spring.mail.host=${SMTP_HOST:smtp.gmail.com}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

resend.api-key=${RESEND_API_KEY}
resend.from-email=${RESEND_FROM_EMAIL:onboarding@resend.dev}


app.storage.provider=${PROFILE_PICTURE_STORAGE_PROVIDER:local}
app.storage.local-directory=${PROFILE_PICTURE_STORAGE_DIRECTORY:./uploads/profile-pictures}
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

frontend.url=${FRONTEND_URL}